# NarutoStormConnectionsRevived audio redirect
# Put title.mp3 or tittle.mp3 in NarutoStormConnectionsRevived\Audio\
# TitleCueId=0 means auto-capture first mode=0 slot=0 cue.
# After testing, check log for: AudioCueRedirector: auto-captured title cueId=####
